context:
  version: "3.11"

package:
  name: pycparser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pycparser/pycparser-${{ version }}.tar.gz
  sha256: d875f09c3507d00e1aba0eecc6dcadc1352f30fff09dc6bff2f1c2935e97c2bc

build:
  number: 0
  noarch: python
  script: python -m pip install . -vvv --no-build-isolation --no-deps && mkdir -p ${SP_DIR}/pycparser/utils && cp -r utils/fake_libc_include ${SP_DIR}/pycparser/utils

requirements:
  host:
    - pip
    - setuptools
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pycparser
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Complete C99 parser in pure Python
  description: |
    pycparser is a complete parser of the C language, written in pure Python using the PLY parsing library.
    It parses C code into an AST and can serve as a front-end for C compilers or analysis tools.
  homepage: https://github.com/eliben/pycparser
  repository: https://github.com/eliben/pycparser

extra:
  recipe-maintainers:
    - synapticarbors
    - scopatz
